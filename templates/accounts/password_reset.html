{% extends "base/public.html" %}
{% block content %}
<div class="auth" style="grid-template-columns:1fr"><main>
  <h1>Reset your password</h1><p>Enter your email and we’ll send a reset link.</p>
  <form method="post" novalidate>{% csrf_token %}{% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label><input class="field-input" type="email" name="{{ f.html_name }}" id="{{ f.id_for_label }}" required>{% for e in f.errors %}<p class="field-error">{{ e }}</p>{% endfor %}</div>{% endfor %}
  <button class="btn btn-primary" type="submit">Send reset link</button></form>
</main></div>
{% endblock %}
