{% extends "base/public.html" %}
{% block title %}Profile · {{ BRAND.name }}{% endblock %}
{% block content %}
<div class="auth" style="grid-template-columns:1fr">
  <main>
    <h1>Your profile</h1>
    <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
  </main>
</div>
{% endblock %}
