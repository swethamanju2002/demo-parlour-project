{% extends "base/public.html" %}
{% block content %}<div class="auth" style="grid-template-columns:1fr"><main>
{% if validlink %}<h1>Choose a new password</h1>
<form method="post" novalidate>{% csrf_token %}{% include "accounts/_form_fields.html" %}<button class="btn btn-primary" type="submit">Save password</button></form>
{% else %}<h1>This link has expired</h1><p>Request a new reset link to continue.</p><a class="btn btn-primary" href="{% url 'accounts:password_reset' %}">Request new link</a>{% endif %}
</main></div>{% endblock %}
